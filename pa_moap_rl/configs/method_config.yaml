# Fixed PA-MOAP teaching category and method parameters.

dimensions:
  activity:
    - guidance
    - interaction
    - practice
    - autonomy
    - collaboration
  full:
    - guidance
    - interaction
    - practice
    - autonomy
    - collaboration
    - cognitive_load

categories:
  - 基础
  - 理论
  - 算法
  - 实验
  - 案例
  - 扩展

methods:
  - 讲授法
  - 讨论法
