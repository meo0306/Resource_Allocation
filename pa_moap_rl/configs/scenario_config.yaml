# Synthetic, teaching-interpretable preference scenarios for conditional PPO.

dimensions:
  - guidance
  - interaction
  - practice
  - autonomy
  - collaboration
  - cognitive_load_tolerance

perturbation:
  std: 0.05
  max_abs: 0.10
  clip_min: 0.05
  clip_max: 0.95

student_templates:
  S1:
    name: 结构接受型
    values: [0.85, 0.30, 0.25, 0.25, 0.25, 0.55]
  S2:
    name: 互动讨论型
    values: [0.55, 0.85, 0.40, 0.55, 0.75, 0.65]
  S3:
    name: 实践应用型
    values: [0.50, 0.55, 0.90, 0.50, 0.60, 0.75]
  S4:
    name: 自主探究型
    values: [0.30, 0.55, 0.65, 0.90, 0.45, 0.80]
  S5:
    name: 协作项目型
    values: [0.40, 0.80, 0.75, 0.65, 0.90, 0.80]
  S6:
    name: 均衡适应型
    values: [0.60, 0.60, 0.60, 0.60, 0.60, 0.70]

teacher_templates:
  T1:
    name: 讲授组织型
    values: [0.90, 0.30, 0.25, 0.25, 0.25, 0.65]
  T2:
    name: 讨论引导型
    values: [0.60, 0.90, 0.40, 0.55, 0.75, 0.75]
  T3:
    name: 实验实践型
    values: [0.50, 0.55, 0.95, 0.50, 0.60, 0.85]
  T4:
    name: 项目协作型
    values: [0.40, 0.75, 0.80, 0.70, 0.95, 0.90]
  T5:
    name: 数字自主型
    values: [0.55, 0.50, 0.50, 0.90, 0.35, 0.80]
  T6:
    name: 均衡教学型
    values: [0.60, 0.60, 0.60, 0.60, 0.60, 0.75]

# Each template appears during training; these pairings are reserved for
# compositional-generalization evaluation.
held_out_pairs:
  - [S1, T4]
  - [S2, T5]
  - [S3, T6]
  - [S4, T1]
  - [S5, T2]
  - [S6, T3]
