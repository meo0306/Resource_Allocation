[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-moap-rl"
version = "0.1.0"
description = "Preference-aware method assignment optimization for PA-MOAP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
  "tensorboard",
  "pandas",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
include = ["pa_moap_rl*"]

[tool.setuptools.package-data]
pa_moap_rl = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
